name: Diagnóstico dos boletins de urna

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/bu-diag.yml"

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Conjuntos e arquivos no portal de dados abertos do TSE
        run: |
          curl -fsSL --retry 3 "https://dadosabertos.tse.jus.br/api/3/action/package_show?id=resultados-2026-boletim-de-urna" \
            | python3 -c "import sys,json; r=json.load(sys.stdin)['result']; print(r['name'], r.get('metadata_modified')); [print(x.get('name'), x.get('url'), x.get('size'), x.get('last_modified')) for x in r['resources']]" \
            || curl -fsSL "https://dadosabertos.tse.jus.br/api/3/action/package_search?q=boletim%20de%20urna%202026&rows=20" | python3 -c "import sys,json; [print(p['name'], p.get('title')) for p in json.load(sys.stdin)['result']['results']]"
      - name: Cabeçalho e primeiras linhas (AC, 1º turno)
        run: |
          url=$(curl -fsSL "https://dadosabertos.tse.jus.br/api/3/action/package_show?id=resultados-2026-boletim-de-urna" | python3 -c "import sys,json,re; print([x['url'] for x in json.load(sys.stdin)['result']['resources'] if re.search(r'bweb_1t_AC_', x['url'])][0])")
          echo "$url"; curl -fsSL -o ac.zip "$url"; unzip -l ac.zip
          f=$(unzip -Z1 ac.zip | grep -i csv | head -1); unzip -p ac.zip "$f" | iconv -f latin1 -t utf-8 | head -3
          unzip -p ac.zip "$f" | iconv -f latin1 -t utf-8 | awk -F';' 'NR>1 && $0 ~ /"Presidente"/' | head -3
