name: Publicar painel (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: [ccr-5e5cae21-7j2iys]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  # os commits de dados feitos pelo workflow do TSE não disparam "push",
  # então publicamos de novo quando ele termina
  workflow_run:
    workflows: ["Atualizar dados do TSE"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ccr-5e5cae21-7j2iys

      # o Pages precisa ser ativado uma vez, à mão, em Settings → Pages → Source: GitHub Actions
      - name: Conferir se o GitHub Pages está ativado
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --jq .build_type > tipo.txt 2>/dev/null; then
            echo "ativo=sim" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages ativo (modo: $(cat tipo.txt))"
          else
            echo "ativo=nao" >> "$GITHUB_OUTPUT"
            msg="GitHub Pages ainda não está ativado. Abra https://github.com/${{ github.repository }}/settings/pages, em Source escolha 'GitHub Actions' e rode este workflow de novo."
            echo "::warning::$msg"
            echo "### $msg" >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.pages.outputs.ativo == 'sim'
        uses: actions/configure-pages@v5

      - if: steps.pages.outputs.ativo == 'sim'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - if: steps.pages.outputs.ativo == 'sim'
        id: deploy
        uses: actions/deploy-pages@v4
