name: Atualizar dados do TSE

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/dados.yml"

permissions:
  contents: write

concurrency:
  group: dados-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dados:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resultados oficiais (TSE)
        run: python3 scripts/fetch_tse.py --ano 2026

      - name: Malha municipal (IBGE, via tbrugz/geodata-br)
        continue-on-error: true
        run: |
          mkdir -p data/geo
          curl -fsSL --retry 5 -o data/geo/geojs-100-mun.json \
            "https://raw.githubusercontent.com/tbrugz/geodata-br/master/geojson/geojs-100-mun.json"
          python3 scripts/build_geo.py

      - name: Arquivos do painel
        run: python3 scripts/build_web.py 2026

      - name: Gravar no repositório
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data; [ -d web/dados ] && git add web/dados
          git diff --cached --quiet && { echo "sem mudanças"; exit 0; }
          git commit -m "dados: resultados oficiais TSE e malhas IBGE"
          git push
